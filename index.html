<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#070913" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Tao Flow — Cosmic Meditation</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070913;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      transition: opacity 0.5s ease;
    }
    .hud.zen .panel,
    .hud.zen .verse-box {
      opacity: 0;
      pointer-events: none;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: auto;
    }
    .title-badge {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.2);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .btn {
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #f8fafc;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .btn.active {
      border-color: var(--accent, #38bdf8);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.35);
    }
    .bottom-area {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .verse-box {
      max-width: 540px;
      text-align: center;
      background: rgba(7, 9, 19, 0.55);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: 16px;
      padding: 10px 16px;
      font-size: 13px;
      line-height: 1.5;
      color: #cbd5e1;
      pointer-events: auto;
      cursor: pointer;
      transition: opacity 0.4s ease;
    }
    .panel {
      width: 100%;
      max-width: 560px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 20px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: auto;
      transition: opacity 0.4s ease;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      align-items: center;
    }
    .pill {
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.2);
      color: #e2e8f0;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s;
    }
    .pill.active {
      background: rgba(56, 189, 248, 0.22);
      border-color: var(--accent, #38bdf8);
      color: #fff;
    }
    .sliders {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      font-size: 11px;
      color: #94a3b8;
    }
    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent, #38bdf8);
    }
    .breath-label {
      position: fixed;
      top: 16%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 15px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(248, 250, 252, 0.8);
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="cosmos"></canvas>
  <div id="breathLabel" class="breath-label"></div>

  <div id="hud" class="hud">
    <div class="top-bar">
      <div class="title-badge">☯ Tao Flow</div>
      <div style="display:flex; gap:8px;">
        <button id="audioBtn" class="btn">🔇 Sound</button>
        <button id="zenBtn" class="btn">👁 Zen</button>
      </div>
    </div>

    <div class="bottom-area">
      <div id="verseBox" class="verse-box" title="Tap for next verse">
        “The Tao that can be told is not the eternal Tao.” — Tao Te Ching, Ch. 1
      </div>

      <div class="panel">
        <div class="row" id="elementRow">
          <button class="pill active" data-el="water">💧 Water</button>
          <button class="pill" data-el="wood">🌿 Wood</button>
          <button class="pill" data-el="fire">🔥 Fire</button>
          <button class="pill" data-el="earth">🏔 Earth</button>
          <button class="pill" data-el="metal">✨ Metal</button>
        </div>

        <div class="row">
          <div class="row" id="modeRow">
            <button class="pill active" data-mode="attract">Attract</button>
            <button class="pill" data-mode="ripple">Ripple</button>
            <button class="pill" data-mode="disperse">Disperse</button>
          </div>
          <span style="opacity:0.3">|</span>
          <div class="row" id="breathRow">
            <button class="pill active" data-breath="none">Free</button>
            <button class="pill" data-breath="55">5-5 Breath</button>
            <button class="pill" data-breath="478">4-7-8 Breath</button>
          </div>
        </div>

        <div class="sliders">
          <div class="slider-group">
            <span>Mandala Flow Speed</span>
            <input id="speedSlider" type="range" min="-2" max="2" step="0.1" value="0.5" />
          </div>
          <div class="slider-group">
            <span>Qi Particle Density</span>
            <input id="densitySlider" type="range" min="40" max="220" step="10" value="120" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('cosmos');
    const ctx = canvas.getContext('2d');
    let W, H, DPR;

    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * DPR;
      canvas.height = H * DPR;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    const ELEMENTS = {
      water: { primary: '#38bdf8', secondary: '#818cf8', bg: '#070b19', freq: 136.1 },
      wood:  { primary: '#34d399', secondary: '#a3e635', bg: '#06130e', freq: 144.0 },
      fire:  { primary: '#fb7185', secondary: '#fbbf24', bg: '#16080c', freq: 172.06 },
      earth: { primary: '#f59e0b', secondary: '#d97706', bg: '#140f07', freq: 128.0 },
      metal: { primary: '#e2e8f0', secondary: '#94a3b8', bg: '#0b0e14', freq: 194.18 }
    };

    const VERSES = [
      '“The Tao that can be told is not the eternal Tao.” — Ch. 1',
      '“Nothing in the world is as soft and yielding as water, yet nothing can better overcome the hard and strong.” — Ch. 78',
      '“Nature does not hurry, yet everything is accomplished.” — Ch. 47',
      '“When you realize there is nothing lacking, the whole world belongs to you.” — Ch. 44',
      '“Be content with what you have; rejoice in the way things are.” — Ch. 44',
      '“Knowing others is intelligence; knowing yourself is true wisdom.” — Ch. 33'
    ];

    const TRIGRAMS = [
      [1,1,1], [0,1,1], [1,0,1], [0,0,1],
      [0,0,0], [1,0,0], [0,1,0], [1,1,0]
    ];

    let state = {
      element: 'water',
      mode: 'attract',
      breath: 'none',
      speed: 0.5,
      density: 120,
      angle: 0,
      pointer: { x: W / 2, y: H / 2, active: false },
      verseIdx: 0
    };

    // Stars & Qi Particles
    const stars = Array.from({ length: 140 }, () => ({
      x: Math.random(),
      y: Math.random(),
      r: Math.random() * 1.6 + 0.3,
      twinkle: Math.random() * Math.PI * 2
    }));

    let particles = [];
    function syncParticles() {
      while (particles.length < state.density) {
        particles.push({
          x: Math.random() * W,
          y: Math.random() * H,
          vx: (Math.random() - 0.5) * 0.6,
          vy: (Math.random() - 0.5) * 0.6,
          size: Math.random() * 2.4 + 1
        });
      }
      if (particles.length > state.density) {
        particles.length = state.density;
      }
    }
    syncParticles();

    // Pointer Interaction
    function updatePointer(e, active) {
      const pt = e.touches ? e.touches[0] : e;
      if (pt) {
        state.pointer.x = pt.clientX;
        state.pointer.y = pt.clientY;
      }
      state.pointer.active = active;
      requestWakeLock();
    }
    canvas.addEventListener('pointerdown', (e) => updatePointer(e, true));
    canvas.addEventListener('pointermove', (e) => { if (state.pointer.active) updatePointer(e, true); });
    window.addEventListener('pointerup', () => { state.pointer.active = false; });

    // Screen Wake Lock for Meditation
    let wakeLock = null;
    async function requestWakeLock() {
      if ('wakeLock' in navigator && !wakeLock) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        } catch (_) {}
      }
    }

    // Generative Web Audio Drone & Chimes
    let audioCtx = null, osc1 = null, osc2 = null, masterGain = null, audioOn = false;
    function toggleAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.0001;
        masterGain.connect(audioCtx.destination);

        osc1 = audioCtx.createOscillator();
        osc2 = audioCtx.createOscillator();
        osc1.type = 'sine';
        osc2.type = 'triangle';
        const subGain = audioCtx.createGain();
        subGain.gain.value = 0.25;

        osc1.connect(masterGain);
        osc2.connect(subGain);
        subGain.connect(masterGain);
        updateAudioFreq();
        osc1.start();
        osc2.start();
      }
      audioOn = !audioOn;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      masterGain.gain.setTargetAtTime(audioOn ? 0.14 : 0.0001, audioCtx.currentTime, 0.4);
      const btn = document.getElementById('audioBtn');
      btn.textContent = audioOn ? '🔊 Sound' : '🔇 Sound';
      btn.classList.toggle('active', audioOn);
    }

    function updateAudioFreq() {
      if (!osc1 || !audioCtx) return;
      const base = ELEMENTS[state.element].freq;
      osc1.frequency.setTargetAtTime(base, audioCtx.currentTime, 0.5);
      osc2.frequency.setTargetAtTime(base * 1.5, audioCtx.currentTime, 0.5);
    }

    // UI Bindings
    document.getElementById('audioBtn').addEventListener('click', toggleAudio);
    document.getElementById('zenBtn').addEventListener('click', () => {
      document.getElementById('hud').classList.toggle('zen');
    });
    document.getElementById('verseBox').addEventListener('click', () => {
      state.verseIdx = (state.verseIdx + 1) % VERSES.length;
      document.getElementById('verseBox').textContent = VERSES[state.verseIdx];
    });

    document.querySelectorAll('#elementRow .pill').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#elementRow .pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.element = btn.dataset.el;
        document.documentElement.style.setProperty('--accent', ELEMENTS[state.element].primary);
        updateAudioFreq();
      });
    });

    document.querySelectorAll('#modeRow .pill').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#modeRow .pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.mode = btn.dataset.mode;
      });
    });

    document.querySelectorAll('#breathRow .pill').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#breathRow .pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.breath = btn.dataset.breath;
      });
    });

    document.getElementById('speedSlider').addEventListener('input', (e) => {
      state.speed = parseFloat(e.target.value);
    });
    document.getElementById('densitySlider').addEventListener('input', (e) => {
      state.density = parseInt(e.target.value, 10);
      syncParticles();
    });

    // Breathing Calculation
    const breathLabel = document.getElementById('breathLabel');
    function getBreathScale(timeSec) {
      if (state.breath === 'none') {
        breathLabel.textContent = '';
        return 1 + Math.sin(timeSec * 0.8) * 0.03;
      }
      if (state.breath === '55') {
        const cycle = timeSec % 10;
        if (cycle < 5) {
          breathLabel.textContent = 'Inhale';
          return 0.85 + (cycle / 5) * 0.35;
        } else {
          breathLabel.textContent = 'Exhale';
          return 1.2 - ((cycle - 5) / 5) * 0.35;
        }
      }
      if (state.breath === '478') {
        const cycle = timeSec % 19;
        if (cycle < 4) {
          breathLabel.textContent = 'Inhale (4s)';
          return 0.85 + (cycle / 4) * 0.35;
        } else if (cycle < 11) {
          breathLabel.textContent = 'Hold (7s)';
          return 1.2;
        } else {
          breathLabel.textContent = 'Exhale (8s)';
          return 1.2 - ((cycle - 11) / 8) * 0.35;
        }
      }
      return 1;
    }

    // Render Loop
    function drawMandala(cx, cy, radius, el) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(state.angle);

      // Outer Bagua Ring
      ctx.strokeStyle = el.primary;
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = 0.45;
      ctx.beginPath();
      ctx.arc(0, 0, radius * 1.38, 0, Math.PI * 2);
      ctx.stroke();

      TRIGRAMS.forEach((lines, idx) => {
        ctx.save();
        ctx.rotate((idx * Math.PI) / 4);
        lines.forEach((solid, lineIdx) => {
          const y = -radius * (1.14 + lineIdx * 0.07);
          ctx.fillStyle = el.secondary;
          ctx.globalAlpha = 0.75;
          if (solid) {
            ctx.fillRect(-16, y, 32, 3);
          } else {
            ctx.fillRect(-16, y, 13, 3);
            ctx.fillRect(3, y, 13, 3);
          }
        });
        ctx.restore();
      });

      // Luminous Taijitu (Yin-Yang)
      ctx.globalAlpha = 0.92;
      ctx.shadowColor = el.primary;
      ctx.shadowBlur = 24;

      // Light Half
      ctx.fillStyle = '#f1f5f9';
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.fill();

      // Dark Half
      ctx.fillStyle = '#090d1a';
      ctx.beginPath();
      ctx.arc(0, 0, radius, -Math.PI / 2, Math.PI / 2);
      ctx.arc(0, radius / 2, radius / 2, Math.PI / 2, -Math.PI / 2, true);
      ctx.arc(0, -radius / 2, radius / 2, Math.PI / 2, -Math.PI / 2, false);
      ctx.fill();

      // Dots
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#090d1a';
      ctx.beginPath();
      ctx.arc(0, -radius / 2, radius * 0.14, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#f1f5f9';
      ctx.beginPath();
      ctx.arc(0, radius / 2, radius * 0.14, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    let lastTime = performance.now();
    function animate(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      const timeSec = now / 1000;
      const el = ELEMENTS[state.element];

      ctx.fillStyle = el.bg;
      ctx.fillRect(0, 0, W, H);

      // Nebula Glow
      const cx = W / 2;
      const cy = H * 0.43;
      const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, Math.max(W, H) * 0.6);
      grad.addColorStop(0, el.primary + '28');
      grad.addColorStop(0.5, el.secondary + '10');
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // Twinkling Stars
      stars.forEach(s => {
        const alpha = 0.3 + 0.5 * Math.sin(timeSec * 1.5 + s.twinkle);
        ctx.fillStyle = `rgba(248, 250, 252, ${alpha})`;
        ctx.beginPath();
        ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Qi Particles
      particles.forEach(p => {
        if (state.pointer.active) {
          const dx = state.pointer.x - p.x;
          const dy = state.pointer.y - p.y;
          const dist = Math.hypot(dx, dy) + 1;
          if (dist < 220) {
            const force = (1 - dist / 220) * 18 * dt;
            if (state.mode === 'attract') {
              p.vx += (dx / dist) * force;
              p.vy += (dy / dist) * force;
            } else if (state.mode === 'disperse') {
              p.vx -= (dx / dist) * force * 1.5;
              p.vy -= (dy / dist) * force * 1.5;
            } else if (state.mode === 'ripple') {
              p.vx += (-dy / dist) * force * 1.4;
              p.vy += (dx / dist) * force * 1.4;
            }
          }
        }
        p.vx *= 0.96;
        p.vy *= 0.96;
        p.x = (p.x + p.vx + W) % W;
        p.y = (p.y + p.vy + H) % H;

        ctx.fillStyle = el.primary;
        ctx.globalAlpha = 0.65;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      state.angle += state.speed * dt;
      const scale = getBreathScale(timeSec);
      const baseRadius = Math.min(W, H) * 0.17 * scale;
      drawMandala(cx, cy, baseRadius, el);

      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    // Register Offline PWA Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
